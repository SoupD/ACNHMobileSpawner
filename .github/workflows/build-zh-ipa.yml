name: 构建中文 IPA (ACNHMobileSpawner)

# 手动触发
on:
  workflow_dispatch:

jobs:
  # iOS 构建必须用 macOS + Xcode。
  # 直接用 macOS runner 原生构建（经 Unity Hub 安装 6000.3.4f1），
  # 不依赖 GameCI 的 Linux Docker 镜像（该镜像不存在 6000.3.4f1-ios）。
  build-ipa:
    name: 汉化并构建中文 IPA
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载中文字体
        run: |
          URL="https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          curl -fL --retry 4 --retry-delay 3 -o NotoSansCJKsc-Regular.otf "$URL" \
            || curl -fL --retry 4 -o NotoSansCJKsc-Regular.otf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          test -s NotoSansCJKsc-Regular.otf
          ls -lh NotoSansCJKsc-Regular.otf

      - name: 应用简体中文补丁
        run: |
          export PYTHONDONTWRITEBYTECODE=1   # 避免生成 __pycache__ 弄脏分支
          python apply_zh_patch.py ACNHMS_Source
          echo "---- patch stats above ----"

      # game-ci 要求构建前分支干净，否则报 "Branch is dirty"。
      # 把汉化补丁产生的改动提交掉，分支即恢复干净（官方推荐做法）。
      - name: 提交汉化改动（保持分支干净）
        run: |
          git config user.name "CI Builder"
          git config user.email "ci@builder.local"
          git add -A
          git -c commit.gpgsign=false commit -m "Apply zh-CN localization patch" || echo "nothing to commit"
          git status --short
          echo "---- branch cleaned ----"

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ACNHMS_Source/Library
          key: Library-iOS-${{ hashFiles('ACNHMS_Source/Assets/**', 'ACNHMS_Source/Packages/**', 'ACNHMS_Source/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: 检查 Unity 授权 Secret
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          echo "UNITY_EMAIL     : $([ -n "$UNITY_EMAIL" ] && echo '已设置' || echo '❌ 缺失')"
          echo "UNITY_PASSWORD  : $([ -n "$UNITY_PASSWORD" ] && echo '已设置' || echo '❌ 缺失')"
          echo "UNITY_LICENSE   : $([ -n "$UNITY_LICENSE" ] && echo '已设置' || echo '未设置')"
          echo "UNITY_SERIAL    : $([ -n "$UNITY_SERIAL" ] && echo '已设置' || echo '未设置')"
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::UNITY_LICENSE 和 UNITY_SERIAL 至少需要一个！个人免费版请配置 UNITY_LICENSE（.ulf 文件内容）。"
            exit 1
          fi

      # Unity Hub 4 废弃了 --headless install 命令，而 GameCI v4 仍在使用，
      # 会报 "'install' is not supported by the native Unity Hub"。
      # 这里预先安装最后一个支持该命令的 Hub 3.22.6，GameCI 检测到已安装便不会装 Hub 4。
      - name: 安装 Unity Hub 3.22.6（兼容 GameCI v4 的 headless install）
        timeout-minutes: 15
        run: |
          HUB_VER="3.22.6"
          # 注意：绝不要直接启动 "Unity Hub.app/Contents/MacOS/Unity Hub"（它是 GUI 程序，
          # 在无界面的 CI 里会挂起数小时直到 job 超时）。只读 Info.plist 取版本号。
          if [ -f "/Applications/Unity Hub.app/Contents/Info.plist" ]; then
            echo "Unity Hub 已存在，版本：$(defaults read '/Applications/Unity Hub.app/Contents/Info' CFBundleShortVersionString 2>/dev/null || echo unknown)"
          fi
          # 若已装的是 Hub 4，先卸载它
          if [ -d "/Applications/Unity Hub.app" ]; then
            echo "移除已存在的 Unity Hub（避免 Hub 4 的 headless 不兼容）"
            rm -rf "/Applications/Unity Hub.app"
          fi
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then UARCH="arm64"; else UARCH="x64"; fi
          URL="https://public-cdn.cloud.unity3d.com/hub/prod/${HUB_VER}/UnityHubSetup-${HUB_VER}-${UARCH}.dmg"
          echo "Downloading $URL"
          curl -fL --retry 3 -o /tmp/UnityHub.dmg "$URL"
          hdiutil attach /tmp/UnityHub.dmg -nobrowse -quiet
          # 卷名可能带版本后缀，用挂载点动态查找 .app
          HUB_APP=$(find /Volumes -maxdepth 2 -name "Unity Hub.app" -type d 2>/dev/null | head -n 1)
          echo "Found app: $HUB_APP"
          test -n "$HUB_APP"
          cp -R "$HUB_APP" /Applications/
          VOL=$(echo "$HUB_APP" | cut -d/ -f3)
          hdiutil detach "/Volumes/$VOL" -quiet || true

          # 关键：禁用 Hub 自动更新。否则 Hub 3 启动时会去下载 Hub 4 更新包（ShipIt），
          # 在无界面 CI 里可能卡住导致 job 超时（上一次跑了 6 小时就是这个原因之一）。
          sudo mkdir -p "/Library/Application Support/Unity/config"
          echo '{"hubDisableAutoUpdate":true,"hubDisableAnalytics":true}' | sudo tee "/Library/Application Support/Unity/config/services-config.json" >/dev/null
          mkdir -p "$HOME/Library/Application Support/UnityHub"
          echo '{"skipUnityAutoUpdate":true}' > "$HOME/Library/Application Support/UnityHub/preferences.json"
          rm -rf "$HOME/Library/Caches/com.unity3d.unityhub.ShipIt" || true

          echo "已安装 Unity Hub 版本：$(defaults read '/Applications/Unity Hub.app/Contents/Info' CFBundleShortVersionString 2>/dev/null || echo unknown)"
          echo "---- Unity Hub 3 installed ----"

      - name: Unity 构建 iOS (macOS 原生，经 Unity Hub)
        timeout-minutes: 90
        uses: game-ci/unity-builder@v4
        env:
          # 同时传递：个人版用 UNITY_LICENSE(.ulf)，专业版用 UNITY_SERIAL；GameCI 自动选择
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ACNHMS_Source
          unityVersion: 6000.3.4f1
          targetPlatform: iOS
          buildName: ACNHMobileSpawner
          # 关闭 GameCI 自带的 Hub/编辑器缓存：默认缓存会把 Hub 4.0.1 恢复回来覆盖我们预装的 Hub 3。
          # Hub 3 由上面的步骤预装；编辑器由 GameCI 用 Hub 3 的 headless install 安装。
          cacheUnityInstallationOnMac: false

      # Unity 导出的是 Xcode 工程，这里用 xcodebuild 归档并打成未签名 IPA。
      # 未签名 IPA 可用 AltStore / Sideloadly / 爱思助手 等自签侧载。
      - name: 选择最新 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 归档 (无签名)
        run: |
          echo "---- build output tree ----"
          find build/iOS -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
          # 优先用 xcworkspace（有 UnityFramework 时），否则用 xcodeproj
          WS=$(find build/iOS -maxdepth 4 -name "*.xcworkspace" | head -n 1)
          PROJ=$(find build/iOS -maxdepth 4 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WS" ]; then
            echo "Using workspace: $WS"
            xcodebuild -workspace "$WS" -scheme Unity-iPhone -configuration Release \
              -archivePath "$PWD/build/Unity-iPhone.xcarchive" \
              CODE_SIGNING_ALLOWED=NO -allowProvisioningUpdates clean archive
          else
            echo "Using project: $PROJ"
            xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
              -archivePath "$PWD/build/Unity-iPhone.xcarchive" \
              CODE_SIGNING_ALLOWED=NO -allowProvisioningUpdates clean archive
          fi

      - name: 导出未签名 IPA
        run: |
          mkdir -p Payload ipa-out
          APP=$(find build/Unity-iPhone.xcarchive/Products -maxdepth 4 -name "*.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          cp -R "$APP" Payload/
          # 移除签名与 watch 目录，保证侧载工具不报错
          rm -rf Payload/*.app/Watch Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision
          zip -qry ipa-out/ACNHMobileSpawner-zh-CN.ipa Payload
          ls -lh ipa-out/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ACNHMobileSpawner-zh-CN-ipa
          path: ipa-out/*.ipa
          retention-days: 30
