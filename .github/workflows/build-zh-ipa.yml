name: 构建中文 IPA (ACNHMobileSpawner) v2

# 手动触发
on:
  workflow_dispatch:

jobs:
  # 个人账号用 NUL（邮箱+密码）激活。GameCI v6 的新 CLI 支持个人 license，
  # 且能自动激活/归还，不依赖旧的 serial-only 激活脚本。
  build-ipa:
    name: 汉化并构建中文 IPA (v6)
    # 固定 macOS 15：macos-latest 现为 macOS 26 (Darwin 25)，
    # Unity 6000.3.4f1 在该系统下 build 进程 licensing 后异常崩溃。
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载中文字体
        run: |
          URL="https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          curl -fL --retry 4 --retry-delay 3 -o NotoSansCJKsc-Regular.otf "$URL" \
            || curl -fL --retry 4 -o NotoSansCJKsc-Regular.otf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          test -s NotoSansCJKsc-Regular.otf
          ls -lh NotoSansCJKsc-Regular.otf

      - name: 应用简体中文补丁
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python apply_zh_patch.py ACNHMS_Source
          echo "---- patch stats above ----"

      - name: 提交汉化改动（保持分支干净）
        run: |
          git config user.name "CI Builder"
          git config user.email "ci@builder.local"
          git add -A
          git -c commit.gpgsign=false commit -m "Apply zh-CN localization patch" || echo "nothing to commit"
          git status --short
          echo "---- branch cleaned ----"

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ACNHMS_Source/Library
          key: Library-iOS-v2-${{ hashFiles('ACNHMS_Source/Assets/**', 'ACNHMS_Source/Packages/**', 'ACNHMS_Source/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-v2-

      # v6 构建会自动归还它激活的许可证；这里只清理 runner 上可能残留的旧 license 文件，
      # 避免旧文件冲突（Unity 官方说旧 .ulf/.xml 会导致激活失败）。
      - name: 清理残留 Unity 许可证文件
        run: |
          sudo rm -f "/Library/Application Support/Unity/Unity_lic.ulf" \
                    "/Library/Application Support/Unity/"*.xml 2>/dev/null || true
          echo "---- stale license files cleaned ----"

      - name: Unity 构建 iOS (GameCI v6, 个人账号新版激活)
        timeout-minutes: 120
        uses: game-ci/unity-builder@v6
        env:
          # GameCI v6 有专门的 personal 分支：只凭邮箱+密码激活免费个人席位，
          # 不需要 serial 或 .ulf（新版源码明确：UNITY_EMAIL+UNITY_PASSWORD = Personal free seat）。
          # 切勿传 UNITY_LICENSE：那会走 file 模式，而免费席位不支持手动 .ulf 激活。
          # 且新版内置最多 5 次重试，专治 ULF 激活超时等临时错误。
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # 给 game-ci CLI 的 GitHub API 调用认证，避免匿名限流 403。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ACNHMS_Source
          targetPlatform: iOS
          buildName: ACNHMobileSpawner
          cacheUnityInstallationOnMac: true
          enableBuildRetry: true
          # 固定 CLI 版本：默认 latest 会调用 GitHub API 解析最新版本，
          # 今天跑了很多次触发 API 限流会报 "GitHub API returned 403"。
          cliVersion: v0.1.77

      # 构建失败时收集 Unity 日志，便于定位真正错误（GitHub 网页看不到完整日志正文）。
      - name: 失败时收集 Unity 诊断日志
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diag
          for f in \
            "$HOME/Library/Logs/Unity/Editor.log" \
            "$HOME/Library/Logs/Unity/Unity.Licensing.Client.log" \
            "ACNHMS_Source/out.log" \
            "$HOME/.config/unity3d/Unity/Editor.log"; do
            [ -f "$f" ] && cp "$f" diag/ 2>/dev/null || true
          done
          find "$HOME/.game-ci" -name "*.log" -o -name "*.txt" 2>/dev/null | head -20 | while read f; do cp "$f" diag/ 2>/dev/null || true; done
          ls -lah diag/ || true
          echo "========== UNITY ERRORS (copy these to me) =========="
          for f in diag/*; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            grep -iE "error|exception|failed|fatal|abort|crash" "$f" 2>/dev/null | tail -60 || true
          done
          echo "========== FULL out.log (last 200 lines) =========="
          [ -f "ACNHMS_Source/out.log" ] && tail -200 "ACNHMS_Source/out.log" || echo "(no out.log)"
          echo "========== BUILD STEP ERRORS FROM ACTIONS LOG =========="
          # 用 token 拉本次 job 完整日志（含被网页截断的 build 输出），grep 出真正的错误
          JOB_ID=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}/jobs" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['jobs'][0]['id'] if d.get('jobs') else '')" 2>/dev/null || true)
          echo "job id: $JOB_ID"
          if [ -n "$JOB_ID" ]; then
          curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" -o joblogs.zip || true
          if [ -s joblogs.zip ]; then
            mkdir -p joblogs && unzip -q -o joblogs.zip -d joblogs 2>/dev/null || true
            grep -iE "error CS|error:|exception|BuildFailedException|Failed to|fatal|abort|Application is shutting down" \
              joblogs/* 2>/dev/null | tail -80 || echo "(no error lines found in job log)"
          fi
          fi
          echo "========== END UNITY ERRORS =========="
      - name: 上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diagnostics
          path: diag/
          if-no-files-found: warn
          retention-days: 7

      # Unity 导出的是 Xcode 工程，这里用 xcodebuild 归档并打成未签名 IPA。
      - name: 选择最新 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 归档 (无签名)
        run: |
          echo "---- build output tree ----"
          find build -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
          WS=$(find build -maxdepth 5 -name "*.xcworkspace" | head -n 1)
          PROJ=$(find build -maxdepth 5 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WS" ]; then
            echo "Using workspace: $WS"
            xcodebuild -workspace "$WS" -scheme Unity-iPhone -configuration Release \
              -archivePath "$PWD/build/Unity-iPhone.xcarchive" \
              CODE_SIGNING_ALLOWED=NO clean archive
          else
            echo "Using project: $PROJ"
            xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release \
              -archivePath "$PWD/build/Unity-iPhone.xcarchive" \
              CODE_SIGNING_ALLOWED=NO clean archive
          fi

      - name: 导出未签名 IPA
        run: |
          mkdir -p Payload ipa-out
          APP=$(find build/Unity-iPhone.xcarchive/Products -maxdepth 4 -name "*.app" | head -n 1)
          echo "APP=$APP"
          test -n "$APP"
          cp -R "$APP" Payload/
          rm -rf Payload/*.app/Watch Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision
          zip -qry ipa-out/ACNHMobileSpawner-zh-CN.ipa Payload
          ls -lh ipa-out/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ACNHMobileSpawner-zh-CN-ipa
          path: ipa-out/*.ipa
          retention-days: 30
