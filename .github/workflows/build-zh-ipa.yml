name: 构建中文 IPA (ACNHMobileSpawner)

# 手动触发；也可在推送到 main 时触发
on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1) 用 Unity 构建出 iOS 的 Xcode 工程（Linux runner 更便宜）
  # ---------------------------------------------------------------
  build-xcode:
    name: Unity 构建 iOS Xcode 工程
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载中文字体
        run: |
          URL="https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          curl -fL --retry 4 --retry-delay 3 -o NotoSansCJKsc-Regular.otf "$URL" \
            || curl -fL --retry 4 -o NotoSansCJKsc-Regular.otf \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          test -s NotoSansCJKsc-Regular.otf
          ls -lh NotoSansCJKsc-Regular.otf

      - name: 应用简体中文补丁
        run: |
          python apply_zh_patch.py ACNHMS_Source
          echo "---- patch stats above ----"

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ACNHMS_Source/Library
          key: Library-iOS-${{ hashFiles('ACNHMS_Source/Assets/**', 'ACNHMS_Source/Packages/**', 'ACNHMS_Source/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Unity 构建 (iOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ACNHMS_Source
          unityVersion: auto
          targetPlatform: iOS
          buildName: ACNHMobileSpawner

      - name: 打包 Xcode 工程 (保留执行权限)
        run: |
          tar -czf xcode-project.tgz -C build/iOS .
          ls -lh xcode-project.tgz

      - name: 上传 Xcode 工程
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 1

  # ---------------------------------------------------------------
  # 2) 在 macOS 上把 Xcode 工程导出为未签名 IPA
  #    未签名 IPA 可用 AltStore / Sideloadly / 爱思助手 等自签侧载
  # ---------------------------------------------------------------
  make-ipa:
    name: 导出 IPA
    needs: build-xcode
    runs-on: macos-latest
    steps:
      - name: 下载 Xcode 工程
        uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: 解压
        run: |
          mkdir -p xcodeproj
          tar -xzf xcode-project.tgz -C xcodeproj
          find xcodeproj -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace" | head

      - name: 选择最新 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 归档 (无签名)
        run: |
          PROJ=$(find xcodeproj -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "PROJECT=$PROJ"
          xcodebuild -project "$PROJ" \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath "$PWD/build/Unity-iPhone.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: 导出未签名 IPA
        run: |
          mkdir -p Payload ipa-out
          APP=$(find build/Unity-iPhone.xcarchive/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "APP=$APP"
          cp -R "$APP" Payload/
          # 移除签名与 watch 目录，保证侧载工具不报错
          rm -rf Payload/*.app/Watch Payload/*.app/_CodeSignature Payload/*.app/embedded.mobileprovision
          zip -qry ipa-out/ACNHMobileSpawner-zh-CN.ipa Payload
          ls -lh ipa-out/

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ACNHMobileSpawner-zh-CN-ipa
          path: ipa-out/*.ipa
          retention-days: 30
